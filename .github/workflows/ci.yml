name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# NOTE: no `toolchain:` inputs — setup-rust-toolchain reads rust-toolchain.toml,
# keeping the repo's toolchain pin single-sourced.
jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: rustfmt
          cache: false
      - name: Check formatting
        run: cargo fmt --all -- --check

  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Check workspace
        run: cargo check --workspace --all-targets

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: clippy
          cache: false
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: nextest
      - name: Test workspace
        run: cargo nextest run --workspace
      - name: Test documentation examples
        # WHY: nextest does not execute doctests.
        run: cargo test --workspace --doc

  rustdoc:
    name: Rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Build docs with warnings denied
        # WHY: rustdoc warnings, broken intra-doc links included, do not fail
        # a plain `cargo doc`; ambiguous `crate::rrf` links (function vs
        # module) sat on main unnoticed until this job existed.
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps

  docs-drift:
    name: Docs drift (krites extraction)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No stale krites-extraction framing
        # WHY: heurema#21's own Done-when names this exact pattern as the acceptance
        # test for "the engines are written fresh, permanently" (locked in
        # _llm/decisions.toml's `heurema-phase-2-source-settled` entry). Two prior
        # sweeps (#18, #19, #22) each fixed a subset of surfaces and missed others,
        # so the check is codified rather than re-asserted by hand each time.
        # WARNING: --exclude-dir=.github is load-bearing, not cosmetic — this very
        # step's own source line contains the pattern literally, so scanning
        # workflow YAML makes the check fail on itself.
        run: |
          if grep -rniE 'extract.*(hnsw|bm25|fts).*krites' --exclude-dir=.git --exclude-dir=.github .; then
            echo "::error::Stale krites-extraction framing found (heurema#21 regression)." >&2
            echo "::error::The engines are written fresh, permanently — krites is behavioural" >&2
            echo "::error::reference + conformance oracle only. See CLAUDE.md's Roadmap" >&2
            echo "::error::entry and _llm/decisions.toml's heurema-phase-2-source-settled." >&2
            exit 1
          fi
      - name: Cited paths resolve; no stub-era engine-state wording
        # WHY: engine-state drift outlived both engine landings (#48, #50):
        # docs kept citing a deleted stub file and describing the engines as
        # pending, and the grep above could not see it. The script checks the
        # class rather than one phrasing; see its header for both rules.
        run: scripts/docs-drift.sh
