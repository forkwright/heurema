[package]
name = "heurema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared vector (HNSW), full-text (BM25), persistence, and reciprocal-rank-fusion search primitives for the forkwright fleet."
readme = "../../README.md"
keywords = ["search", "hnsw", "bm25", "rrf", "vector"]
categories = ["data-structures"]

[dependencies]
snafu = { workspace = true }
# WHY: PersistenceBackend's save/load methods bound `I` on Serialize /
# DeserializeOwned (persistence.rs); HnswConfig, VectorDistance, HnswIndex,
# FtsConfig, TokenizerConfig, and Bm25Index all derive both so a caller-chosen
# concrete index type satisfies the bound.
serde = { workspace = true }

# WHY dev-only: the library itself never encodes bytes (that's the adapter
# crates' job); persistence_schema_closed.rs decodes hand-built JSON directly
# to prove HnswIndex/Bm25Index close their schema at the type level,
# independent of any adapter.
[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true

# WHY: maturity flag is read by the kanon substrate registry so consumers can
# tell at a glance which API surfaces are still pre-stabilization. Phase 1
# lands the API + RRF; HNSW + FTS bodies are written fresh in Phase 2.
[package.metadata.kanon]
maturity = "alpha"
since = "2026-05-25"
phase = "1"
phase-description = "scaffold + API + RRF; HNSW/FTS stubbed pending a fresh implementation"
exit-criteria = "Phase 2 HNSW + BM25 written fresh, with aletheia/krites as a behavioural reference and its tests as a conformance oracle; tracked at kanon/projects/heurema/ROADMAP.md"
