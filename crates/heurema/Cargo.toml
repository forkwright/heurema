[package]
name = "heurema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared vector (HNSW), full-text (BM25), persistence, and reciprocal-rank-fusion search primitives for the forkwright fleet."
readme = "../../README.md"
keywords = ["search", "hnsw", "bm25", "rrf", "vector"]
categories = ["data-structures"]

[dependencies]
snafu = { workspace = true }
# WHY: PersistenceBackend's save/load methods bound `I` on Serialize /
# DeserializeOwned (persistence.rs); HnswConfig, VectorDistance, HnswIndex,
# FtsConfig, TokenizerConfig, and Bm25Index all derive both so a caller-chosen
# concrete index type satisfies the bound.
serde = { workspace = true }

# WHY: `decode_snapshot_payload` owns the one JSON envelope-header parser used
# by both persistence adapters, so version/family policy is checked before a
# concrete engine deserializes its payload.
serde_json = { workspace = true }

[lints]
workspace = true

# WHY: maturity flag is read by the kanon substrate registry so consumers can
# tell at a glance which API surfaces are still pre-stabilization. Phase 01
# landed the fresh HNSW and BM25 engines; Phase 02 adds the durable retrieval
# lifecycle (phase numbering per CLAUDE.md's Roadmap).
[package.metadata.kanon]
maturity = "alpha"
since = "2026-05-25"
phase = "01"
phase-description = "Phase 01 engines landed (HNSW graph, Simple-pipeline BM25, RRF, versioned snapshot envelope); open exit item: an independently written BM25 formula reference"
exit-criteria = "Every oracle case runs live with unweakened assertions; HNSW meets the pinned brute-force recall floor with engine-local graph invariant tests; BM25 agrees with an independently written formula reference; both keep the trait ranking, error, removal, and persistence contracts"
