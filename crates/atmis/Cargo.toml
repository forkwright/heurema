[package]
name = "atmis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "In-memory PersistenceBackend and LifecycleBackend adapter for heurema indexes; no disk I/O, state lifetime is process lifetime."
readme = "../../README.md"
keywords = ["search", "persistence", "in-memory"]
categories = ["data-structures"]

[dependencies]
heurema = { workspace = true }
# WHY: HeuremaError's variants carry a `snafu::Location` field this adapter
# populates directly (`HeuremaError::IndexNotFound { location, .. }`), so
# `snafu::Location` must resolve here even though heurema itself already
# depends on snafu — a dependency's dependency is not implicitly visible.
snafu = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

# WHY: maturity flag is read by the kanon substrate registry so consumers can
# tell at a glance which API surfaces are still pre-stabilization. The
# adapters shipped with the pre-00 scaffold and gained versioned snapshot
# envelopes in Phase 01; Phase 02 adds the durable lifecycle contract (phase
# numbering per heurema's CLAUDE.md Roadmap).
[package.metadata.kanon]
maturity = "alpha"
since = "2026-08-15"
phase = "02"
phase-description = "PersistenceBackend adapter: HashMap<String, Vec<u8>> snapshots behind an RwLock, each a versioned SnapshotEnvelope encoded with serde_json; LifecycleBackend adapter: five lifecycle maps behind one Mutex, every write one guarded mutation"
