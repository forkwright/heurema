[[recent]]
date = "2026-09-25"
item = "Phase 02 lifecycle driver: heurema::IndexLifecycle validates each operation (stateless check with no backend call, the shared writer, head read, replay lookup by key and digest, active payload, permission, staged-state check), builds the successor version in memory, stages its payload and marker, and publishes head, operation record, and marker removal in one atomic backend write. Reads resolve the head and then the immutable payload it names, so a staged version is never readable; PublishedIndex hits carry identity, provenance, and version. Records are private serde_json encodings with format_version; undecodable bytes are CorruptSnapshot, a newer format UnsupportedSnapshotVersion. crates/thesauros/tests/lifecycle_conformance.rs runs every case on atmis and a tempdir thesauros: interruption before and after the publish point across fjall reopen, injected failures before and after each write, zero-write refusal proofs through a counting backend, replay and conflict across reopen, and orphan staged state blocking its index (Destroy included). Every lifecycle over one backend shares the backend's WriterLock (LifecycleBackend::writer), held from before the head read until publish or drop, so a staged version that a writer holding it for its whole operation meets is interrupted state (a direct backend caller that bypasses it, or holds it only per call, can meet a live stage reported the same way); a thread already holding it is refused with WriterHeld, and another thread waits. The head is read before the replay lookup, the active payload is cross-checked against the head before permit, and validation refuses consumer values that do not read back from their JSON encoding. Tests prove the shared writer on both adapters (re-entry refused on every lifecycle, a cross-thread operation waiting for a live stage), same-key publishes injected between the driver's reads through a wrapper that bypasses the writer (a replay before the lookup, HeadChanged with nothing written after it), a concurrent reader that never sees part of a stage, publish, quarantine, or destroy (including an active head without its payload), racing writers of which exactly one wins each stage, publish, destroy, and quarantine (both concurrent cases catch a split write on thesauros, whose batches are fsync-wide, on a local disk; the margin is fsync latency, so tmpfs weakens it; on atmis they only check correct writes, and one MutexGuard per write is the review item), and the driver's damage branches (a missing or contradicting active payload is CorruptSnapshot). Every published payload is retained until destroy (storage growth); recovery comes next, and it must hold the writer for its whole pass."

[[recent]]
date = "2026-09-25"
item = "Phase 02 lifecycle storage layer: heurema::LifecycleBackend, an object-safe trait beside the unchanged PersistenceBackend, stores opaque heurema-encoded bytes under one storage_key grammar in five maps (heads, versions, staging, operations, quarantine). Stage, publish, destroy, and quarantine are each atomic and durable before Ok (atmis: one mutex; thesauros: one fjall SyncAll write batch under its commit lock, which covers one write's checks through its commit); each compares the head or staged marker it expects, never overwrites a payload or operation record, and refuses while an index holds staged state. Stage checks four things in order: the head (HeadChanged), any staging marker (StagedStateExists), a payload already under the version (VersionStored, Corrupt), and an operation record under its key (OperationRecorded). Recovery-side listings and quarantine are declared now so recovery adds no required method. New HeuremaError variants StagedStateExists, HeadChanged, OperationConflict (boxed detail), StagedStateMissing, OperationRecorded, VersionStored, and ErrorCategory Conflict and RecoveryRequired. crates/thesauros/tests/lifecycle_backend.rs runs every case on both adapters, reopens fjall, and injects faults before and after each write. No driver, encoding, or recovery pass yet."

[[recent]]
date = "2026-09-25"
item = "Phase 02 pre-publish validation (heurema::lifecycle): CheckedOperation::check refuses an invalid operation with no index state (EmptyBatch, DuplicateMember, InvalidIdentifier for a member identity that is not a string or integer, InvalidVector, InvalidHnswConfig, NotYetImplemented, FamilyMismatch, DimensionMismatch, UnencodableOperation) and computes the OperationDigest; permit(current record) enforces the permission table (LifecycleTransition::is_permitted_from) and the checks against the current configuration, yielding a ValidatedOperation. Both are pure. The digest is SHA-256 (sha2 0.11, pure Rust) over a private canonical serde encoding, never serde_json output, pinned by known-answer tests."

