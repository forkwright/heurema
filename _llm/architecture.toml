[meta]
name = "heurema"
repo = "forkwright/heurema"
generated = false
source_docs = [
  "README.md",
  "CLAUDE.md",
  "Cargo.toml",
]

[architecture]
summary = "Shared HNSW vector, BM25 full-text, persistence, and reciprocal-rank-fusion search primitives for the forkwright fleet. The workspace holds the traits-and-engines crate (heurema: HNSW, BM25, RRF, snapshot envelope, and the durable index lifecycle) and its PersistenceBackend and LifecycleBackend adapter siblings (atmis, thesauros)."
layers = [
  "public-api",
  "errors",
  "vector-index",
  "fts-index",
  "persistence",
  "persistence-adapters",
  "rank-fusion",
  "lifecycle-vocabulary",
  "lifecycle-validation",
  "lifecycle-driver",
]

[[architecture.crates]]
name = "heurema"
path = "crates/heurema"
role = "Public traits (VectorIndex, FtsIndex, PersistenceBackend), the in-memory HNSW graph (HnswIndex) and Simple-pipeline BM25 engine (Bm25Index), reciprocal-rank fusion, the versioned per-index snapshot envelope (SnapshotEnvelope, SnapshotFamily, decode_snapshot_payload), the Phase 02 durable-lifecycle vocabulary and pre-publish validation (lifecycle module: identities, operations, transitions, index record, CheckedOperation / ValidatedOperation, the canonical OperationDigest; pure functions), its storage contract (LifecycleBackend, storage_key), and its driver (IndexLifecycle: stage and atomic publish over private serde_json record encodings, PublishedIndex reads), and the workspace error chain with its ErrorCategory classification."

[[architecture.crates]]
name = "atmis"
path = "crates/atmis"
role = "In-memory PersistenceBackend and LifecycleBackend adapter: HashMap<String, Vec<u8>> snapshots behind an RwLock, each a versioned SnapshotEnvelope encoded with serde_json, and five lifecycle maps behind one Mutex so every lifecycle write is one guarded mutation (a poisoned lock is refused, never recovered). No disk I/O; the default backend for tests."

[[architecture.crates]]
name = "thesauros"
path = "crates/thesauros"
role = "Durable PersistenceBackend and LifecycleBackend adapter: a fjall database with separate vector_indexes/fts_indexes keyspaces, each snapshot a versioned SnapshotEnvelope encoded with serde_json, fsyncing (PersistMode::SyncAll) after every write; five fixed lifecycle keyspaces, every lifecycle write one SyncAll write batch committed under a backend-owned lock, reads through an fjall snapshot."

[[interfaces]]
crate = "heurema"
kind = "trait"
name = "VectorIndex"
purpose = "Insert / query / remove / cardinality for ID-keyed vectors, with a normative ascending-distance ranking contract. Implemented by HnswIndex."

[[interfaces]]
crate = "heurema"
kind = "trait"
name = "FtsIndex"
purpose = "Insert / query / remove / cardinality for ID-keyed documents, with a normative descending-relevance ranking contract. Implemented by Bm25Index."

[[interfaces]]
crate = "heurema"
kind = "trait"
name = "PersistenceBackend"
purpose = "Save / load named vector and FTS indexes; backend-agnostic so consumers can choose fjall, in-memory, or engine-owned storage."

[[interfaces]]
crate = "heurema"
kind = "type"
name = "HnswIndex"
purpose = "Safe, deterministic, in-memory HNSW graph implementing VectorIndex; validates dimensions, finite components, configuration, and snapshot graph invariants."

[[interfaces]]
crate = "heurema"
kind = "type"
name = "Bm25Index"
purpose = "In-memory BM25 engine implementing FtsIndex for the Simple pipeline; other analyzer pipelines return HeuremaError::NotYetImplemented before mutating state."

[[interfaces]]
crate = "heurema"
kind = "type"
name = "SnapshotEnvelope"
purpose = "Versioned wrapper (format version + SnapshotFamily) around one index's snapshot payload; the shared on-disk and in-memory format of both adapters."

[[interfaces]]
crate = "heurema"
kind = "function"
name = "decode_snapshot_payload"
purpose = "Decode one adapter snapshot after refusing an unsupported format version or wrong SnapshotFamily, before the concrete index decoder sees the payload."

[[interfaces]]
crate = "heurema"
kind = "function"
name = "rrf"
purpose = "Reciprocal-rank fusion with caller-supplied k constant."

[[interfaces]]
crate = "heurema"
kind = "function"
name = "rrf_with_default"
purpose = "Reciprocal-rank fusion with the paper-standard k = 60."

[[interfaces]]
crate = "heurema"
kind = "type"
name = "HeuremaError"
purpose = "Concrete error surface for vector, FTS, fusion, and persistence operations. snafu-derived with Location capture on every variant."

[[interfaces]]
crate = "heurema"
kind = "type"
name = "PersistenceSource"
purpose = "Type-erased adapter for backend-specific persistence errors, kept walkable through std::error::Error::source."

[[interfaces]]
crate = "heurema"
kind = "type"
name = "ErrorCategory"
purpose = "Class of a HeuremaError (Refused, NotFound, Unsupported, Corrupt, Storage, Conflict, RecoveryRequired), returned by HeuremaError::category() through an exhaustive match so a consumer can decide retry, report, or repair without matching variants."

[[interfaces]]
crate = "heurema"
kind = "trait"
name = "LifecycleBackend"
purpose = "Object-safe storage contract of the durable lifecycle, beside the unchanged PersistenceBackend (which has no delete, exists, batch, or compare-and-set and is not dyn-compatible). writer() returns the one WriterLock every lifecycle over the backend shares. Adapters store opaque heurema-encoded bytes under the storage_key grammar and own no encoding or rule. stage, publish, destroy, and quarantine are each atomic and durable before Ok; each compares the head (or staged marker) it expects under a backend-owned lock, never overwrites a payload or operation record, and refuses while the index holds staged state; stage also refuses a payload already under its version (VersionStored) and a recorded operation key. thesauros refuses a value over u32::MAX bytes before writing, and its stage also refuses a head or operation record its publish could not store (StageWrite carries their sizes), so a size refusal never leaves orphan staged state. read_* and list_* serve the driver and recovery. Implemented by AtmisBackend and ThesaurosBackend, and forwarded, writer included, through &B, Box<B>, and Arc<B>."

[[interfaces]]
crate = "heurema"
kind = "module"
name = "storage_key"
purpose = "The one key grammar both lifecycle adapters use: namespace/name heads, namespace/name/{version:020} payloads and staging markers, namespace/name/key operation records, and {sequence:020}/namespace/name/{version:020}/marker|payload quarantine entries, with parsers that report a malformed stored key as CorruptSnapshot. Each kind lives in its own map, because a digits-only operation key spells a version key."

[[interfaces]]
crate = "heurema"
kind = "type"
name = "IndexIdentity"
purpose = "Identity of one named index: an OwnerNamespace plus an IndexName, both validated newtypes (TryFrom only, no '/') so the pair is safe inside storage keys; displays as namespace/name."

[[interfaces]]
crate = "heurema"
kind = "type"
name = "OperationKey"
purpose = "Caller-supplied idempotency key for one lifecycle operation, validated through TryFrom (ULID and URN shapes fit); unique per IndexIdentity, never reused."

[[interfaces]]
crate = "heurema"
kind = "type"
name = "OperationIdentity"
purpose = "An OperationKey plus the OperationDigest of the operation's canonical encoding. No public constructor: a recorded identity can be decoded, but heurema computes the digest of any operation it applies and never accepts a caller-supplied one."

[[interfaces]]
crate = "heurema"
kind = "type"
name = "IndexVersion"
purpose = "Non-zero published version of a named index; Create publishes FIRST and each later mutation publishes successor(), which refuses overflow."

[[interfaces]]
crate = "heurema"
kind = "type"
name = "LifecycleOperation"
purpose = "One requested lifecycle operation (IndexIdentity, OperationKey, IndexChange); new() and Deserialize both require the MemberIdentity, ProvenanceReference, and RetentionReference marker traits."

[[interfaces]]
crate = "heurema"
kind = "type"
name = "IndexChange"
purpose = "The change an operation requests (Create, Insert, Remove, Rebuild, Destroy); Destroy carries a required retention reference. transition() names its LifecycleTransition."

[[interfaces]]
crate = "heurema"
kind = "type"
name = "LifecycleTransition"
purpose = "Every step between lifecycle states: the caller-requested Create, Insert, Remove, Rebuild, Destroy, plus the lifecycle's own Publish and Recover."

[[interfaces]]
crate = "heurema"
kind = "type"
name = "IndexRecord"
purpose = "The named index record's head: identity, IndexConfig (and so family), and IndexState (Active with a version, or Destroyed with last version, retention reference, and destroying operation key). Per-member identity and provenance live in each immutable version payload, not the head."

[[interfaces]]
crate = "heurema"
kind = "trait"
name = "ProvenanceReference"
purpose = "Marker trait a consumer implements on its own provenance newtype; never blanket-implemented, so () or a bare String cannot stand in. heurema defines no provenance shape. MemberIdentity and RetentionReference follow the same rule."

[[interfaces]]
crate = "heurema"
kind = "type"
name = "CheckedOperation"
purpose = "A LifecycleOperation that passed every stateless check, in a documented order (empty batch, duplicate member, member identity shape and its JSON key and value read-back, non-finite vector, configuration validity through the engines' own checks, Rebuild member family and dimension, mixed-family Insert, canonical encodability, then a JSON read-back of every stored provenance, in identity order, and of a Destroy's retention, refused as UnencodableOperation), plus its OperationIdentity. check() is a pure function; permit(current record) applies the permission table and the checks against the current configuration and yields a ValidatedOperation."

[[interfaces]]
crate = "heurema"
kind = "type"
name = "ValidatedOperation"
purpose = "A CheckedOperation permitted against the index's current record; constructible only through CheckedOperation::permit, so it is the only form of an operation later lifecycle steps (staging, publish) accept. Carries the identity, the operation, and the state it was permitted from."

[[interfaces]]
crate = "heurema"
kind = "type"
name = "OperationDigest"
purpose = "SHA-256 over the domain prefix heurema.lifecycle.operation.v1 and the operation's canonical encoding, written by a private serde serializer with a fixed byte grammar documented on the type: sorted map entries, string or integer keys only, floats refused in consumer types, vector components as f32 bit patterns, members sorted by identity, the key not hashed."

[[interfaces]]
crate = "heurema"
kind = "type"
name = "IndexLifecycle"
purpose = "The lifecycle driver over any LifecycleBackend. apply(operation) runs, in order: CheckedOperation::check (no backend call), the backend's shared WriterLock (WriterHeld if this thread already holds it; another thread waits), head read, replay lookup by (index, key) (same digest returns the recorded PublishReceipt with replayed set and writes nothing; another digest is OperationConflict), the active payload cross-checked against the head (CorruptSnapshot when missing or of another configuration), permit, the staged-state check (any staging marker refuses every mutation of the index with StagedStateExists, Create and Destroy included), an in-memory build of the successor version (members in ascending identity order; Rebuild from an empty engine), stage (payload plus marker, head compare-and-set, carrying the sizes of the head and operation record publish writes), and publish (one atomic write of head, operation record, and marker removal; Destroy writes its destroyed head and removes every payload instead). prepare / Prepared::stage / Staged::publish expose the steps. record() reads the head; index() reads the head then only the payload it names, so a staged version is never readable. open() does not recover yet: orphan staged state blocks its index until a later Phase 02 change adds recovery."

[[interfaces]]
crate = "heurema"
kind = "type"
name = "WriterLock"
purpose = "The lifecycle writer every lifecycle over one backend shares, returned by LifecycleBackend::writer. acquire() waits while another thread holds it and refuses a thread that already holds it with WriterHeld; the !Send WriterGuard releases it on drop, unwinding included. Guards no data; not FIFO; a leaked guard keeps it held."

[[interfaces]]
crate = "heurema"
kind = "type"
name = "PublishedIndex"
purpose = "One published version read whole: version, config, member table (MemberEntry per member: provenance, introducing version, superseded version), and query_vector / query_text returning IndexHit values that carry identity, score, provenance, and version. FamilyMismatch when the query's family differs from the index's."

[[interfaces]]
crate = "heurema"
kind = "type"
name = "PublishReceipt"
purpose = "Outcome of a published or replayed operation: index, OperationIdentity, transition, the resulting IndexState (on a replay, the state recorded at first publish), and whether it was a replay."

[[interfaces]]
crate = "heurema"
kind = "type"
name = "MemberChange"
purpose = "Audit linkage of one member in an operation record (Inserted, Replaced, Removed, AbsentOnRemove, Dropped, Retired), carrying the displaced MemberEntry whole. Stored in every operation record now; the read API arrives in a later Phase 02 change without a format change."
