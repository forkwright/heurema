[workspace]
resolver = "2"
members = [
    "crates/heurema",
    "crates/thesauros",
    "crates/atmis",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
license = "MPL-2.0"
homepage = "https://github.com/forkwright/heurema"
repository = "https://github.com/forkwright/heurema"
authors = ["forkwright"]

[workspace.dependencies]
heurema = { version = "0.2.0", path = "crates/heurema" }
# WHY these two are not `heurema-*`: NAMING.md forbids the `[fleet-repo]-[role]`
# shape (it lists `aletheia-classify`, `harmonia-convert`, `aletheia-memory-mcp`
# as exactly this anti-pattern), and `NAMING/no-owner-prefix` flags
# `heurema-fjall` / `heurema-memory` directly. `thesauros` (θησαυρός, storehouse
# — the crate lays snapshots down on disk the way the word's own root, τίθημι
# "to place," names the act) and `atmis` (ἀτμίς, vapor — the crate's state
# rises in the process's memory and leaves no residue when the process ends)
# are independent GNOMON coinages, not sub-senses of `heurema` itself.
thesauros = { version = "0.2.0", path = "crates/thesauros" }
atmis = { version = "0.2.0", path = "crates/atmis" }

# WHY: snafu is the fleet-wide error library per kanon RUST.md. Pinned at the
# workspace root so the single heurema crate inherits via `workspace = true`,
# matching the inheritance pattern adapter sub-crates will use later.
snafu = "0.8"

# WHY: heurema's PersistenceBackend bound (crates/heurema/src/persistence.rs)
# needs Serialize on save and DeserializeOwned on load, so heurema itself
# depends on serde; the adapter crates add serde_json (atmis, thesauros) to
# turn that into snapshot bytes. fjall is thesauros's storage engine, pinned
# at the same major version kanon's own archeion crate already uses
# fleet-wide.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fjall = "2"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# WHY: library code denies these — tests are the only place they may appear,
# and tests are scoped to dev-dependencies. Mirrors kanon workspace lints.
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# WHY: pedantic overrides — fleet baseline. These are noise in this crate.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
similar_names = "allow"
must_use_candidate = "allow"
must_use_unit = "allow"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
