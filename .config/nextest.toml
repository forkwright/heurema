# WHY: several tests guard against deadlock (a thread refused instead of
# waiting for itself, a waiter woken when the writer is released). If the code
# they guard regresses, the test hangs rather than failing. A terminate
# policy turns that hang into a named failure without making a correct run
# depend on timing: correct code answers at once, and the bound is generous
# enough for fsync-bound tests on a slow runner.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }
