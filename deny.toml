# cargo-deny configuration for heurēma.
#
# The advisory + license + ban + sources policy mirrors the fleet baseline.

[graph]
targets = []
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MPL-2.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    # WHY: both added for thesauros's fjall dependency tree, mirroring kanon's
    # own deny.toml (which carries the identical WHY for the identical dep):
    # varint-rs (0BSD) and xxhash-rust (BSL-1.0) sit under lsm-tree/fjall.
    # Both are OSI-approved, permissive licenses.
    "0BSD",
    "BSL-1.0",
]
confidence-threshold = 0.92

[bans]
multiple-versions = "warn"
wildcards = "deny"

[[bans.deny]]
crate = "openssl-sys"
reason = "rustls is the fleet TLS choice; openssl-sys pulls system OpenSSL and complicates supply chain"

# WHY: kanon RUST.md bans `thiserror` (replaced by snafu), `async-trait`
# (native async fn in trait), `lazy_static` (std::sync::LazyLock), and
# `failure` (unmaintained). Applies fleet-wide as a ban on FIRST-PARTY use;
# the source-level basanos rule (RUST/banned-crates) is what actually
# enforces that, since it greps heurema's own source rather than the whole
# resolved dependency tree.
[[bans.deny]]
crate = "thiserror"
reason = "fleet errors use snafu (kanon RUST.md)"

[[bans.deny]]
crate = "async-trait"
reason = "native async fn in trait since Rust 1.75 (kanon RUST.md)"

[[bans.deny]]
crate = "lazy_static"
reason = "std::sync::LazyLock stabilized in 1.80 (kanon RUST.md)"

[[bans.deny]]
crate = "failure"
reason = "abandoned since 2019; use snafu (kanon RUST.md)"

# WHY once_cell has NO [[bans.deny]] entry, unlike its lazy_static sibling
# above: thesauros's fjall dependency tree pulls once_cell transitively
# through dashmap, enum_dispatch, path-dedot, and tempfile — none of them
# heurema code, none of them avoidable without forking fjall. A cargo-deny
# ban blocks the whole resolved tree, not just first-party imports, so it
# fires here with nothing to fix. kanon's own deny.toml (which also depends
# on fjall via archeion) carries no once_cell ban for the same reason.
# RUST/banned-crates (basanos, source-grep) still catches a first-party
# `use once_cell::` if one is ever written; that is the enforcement layer
# for this rule, not cargo-deny.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
